<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Timer · 3D Portfolio Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<header class="header">
    <div class="logo">Reaction<em>.</em>Timer</div>
    <div class="logo-sub">3D Edition &middot; Portfolio Demo</div>
</header>

<div class="stats-row">
    <div class="stat-card">
        <div class="stat-label">Attempts</div>
        <div class="stat-value" id="stat-attempts">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Average</div>
        <div class="stat-value" id="stat-avg">&mdash;</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="stat-best">&mdash;</div>
    </div>
</div>

<div id="overlay">
    <div class="panel" id="panel">
        <div class="panel-eyebrow">Tap anywhere on panel to interact</div>
        <div class="state-heading" id="heading">Ready?</div>
        <div class="state-caption" id="caption">Click the button or press Space to begin</div>

        <div class="timer-block" id="timer-block">
            <div class="timer-number" id="timer-number">0</div>
            <div class="timer-unit">milliseconds</div>
        </div>

        <div id="badge-wrap"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="main-btn">Start Game</button>
            <button class="btn btn-ghost"   id="reset-btn" style="display:none">Reset</button>
        </div>
    </div>
</div>


<div id="game-status" class="game-status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
